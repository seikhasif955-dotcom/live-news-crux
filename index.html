<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsPulse 3D | Cyber Feed</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030408;
            --neon-blue: #00f0ff;
            --neon-purple: #7000ff;
            --neon-pink: #ff007f;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --glass-bg: rgba(10, 12, 24, 0.45);
            --glass-border: rgba(0, 240, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 3D Canvas Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* App Container */
        .app-container {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 80px 20px;
        }

        /* Header UI */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .title-glow {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--neon-blue) 0%, var(--neon-purple) 50%, var(--neon-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.3));
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 0, 127, 0.1);
            color: var(--neon-pink);
            border: 1px solid rgba(255, 0, 127, 0.3);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
        }

        .pulse-dot {
            height: 8px;
            width: 8px;
            background-color: var(--neon-pink);
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
            box-shadow: 0 0 10px var(--neon-pink);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 1; }
            70% { transform: scale(1.6); opacity: 0; }
            100% { transform: scale(0.9); opacity: 0; }
        }

        /* Controls Panel */
        .controls-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        select, input {
            background: rgba(5, 7, 15, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        select {
            flex: 1;
            min-width: 180px;
            cursor: pointer;
        }

        input {
            flex: 2;
            min-width: 220px;
        }

        select:focus, input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(112, 0, 255, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.5);
        }

        /* Quick Tag Pills */
        .tags-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tags-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .tag-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-pill:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }

        /* Status Banner */
        .status-banner {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.25);
            color: var(--neon-blue);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 3D News Cards */
        .news-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 26px;
            margin-bottom: 20px;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--neon-blue), var(--neon-purple));
        }

        .news-card:hover {
            transform: translateY(-6px) rotateX(2deg) rotateY(1deg);
            border-color: rgba(0, 240, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 240, 255, 0.15), 0 0 20px rgba(112, 0, 255, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .source-badge {
            background: rgba(0, 240, 255, 0.1);
            color: var(--neon-blue);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }

        .card-time {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .card-title {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .card-crux {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 18px;
            font-family: 'Inter', sans-serif;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--neon-blue);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .card-link:hover {
            color: var(--neon-pink);
            transform: translateX(4px);
        }

        .loader {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- 3D Canvas Background -->
    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
        <div class="header">
            <h1 class="title-glow">⚡ NewsPulse 3D</h1>
            <div class="live-badge"><span class="pulse-dot"></span>CYBER STREAM ACTIVE</div>
        </div>

        <div class="controls-panel">
            <div class="input-row">
                <select id="categorySelect">
                    <option value="">🔥 Top Stories</option>
                    <option value="world news">🌍 World News</option>
                    <option value="business technology news">💼 Business & Tech</option>
                    <option value="artificial intelligence tech">🤖 AI & Technology</option>
                    <option value="sports news">⚽ Sports</option>
                    <option value="entertainment movie news">🎬 Entertainment</option>
                    <option value="health science news">🧬 Health & Science</option>
                </select>

                <input type="text" id="searchInput" placeholder="Type custom keyword e.g. NVIDIA, Cricket...">

                <div class="btn-group">
                    <button class="btn" onclick="executeSearch()">SEARCH</button>
                    <button class="btn" style="background: rgba(255,255,255,0.08); box-shadow: none;" onclick="resetAndFetch()">🔄</button>
                </div>
            </div>

            <div class="tags-row">
                <span class="tags-label">Trending Tags:</span>
                <span class="tag-pill" onclick="quickTag('NVIDIA')">NVIDIA</span>
                <span class="tag-pill" onclick="quickTag('Tesla')">Tesla</span>
                <span class="tag-pill" onclick="quickTag('Bitcoin')">Bitcoin</span>
                <span class="tag-pill" onclick="quickTag('Cricket')">Cricket</span>
                <span class="tag-pill" onclick="quickTag('Space')">Space</span>
            </div>
        </div>

        <div id="statusBanner" class="status-banner" style="display: none;"></div>
        <div id="newsFeed"></div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 3D Cyber Globe Three.js Background ---
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Core Wireframe Sphere
        const sphereGeo = new THREE.IcosahedronGeometry(35, 2);
        const sphereMat = new THREE.MeshBasicMaterial({
            color: 0x7000ff,
            wireframe: true,
            transparent: true,
            opacity: 0.15
        });
        const globe = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(globe);

        // Outer Particles
        const particleCount = 1200;
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 40 + Math.random() * 8;

            positions[i] = r * Math.sin(phi) * Math.cos(theta);
            positions[i+1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i+2] = r * Math.cos(phi);
        }

        const particleGeo = new THREE.BufferGeometry();
        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
            size: 0.8,
            color: 0x00f0ff,
            transparent: true,
            opacity: 0.6
        });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        scene.add(particleSystem);

        camera.position.z = 90;

        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.0003;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.0003;
        });

        function animate3D() {
            requestAnimationFrame(animate3D);
            globe.rotation.y += 0.002 + mouseX;
            globe.rotation.x += 0.001 + mouseY;
            particleSystem.rotation.y += 0.0015 + mouseX;
            renderer.render(scene, camera);
        }
        animate3D();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Live News Aggregator Script ---
        let seenLinks = new Set();

        function cleanCruxText(rawHtml) {
            if (!rawHtml) return "No summary available for this story.";
            const temp = document.createElement("div");
            temp.innerHTML = rawHtml;
            let text = temp.textContent || temp.innerText || "";
            return text.replace(/\s+/g, " ").trim();
        }

        async function fetchFeed(rssUrl) {
            // Tier 1 Proxy
            try {
                const p1 = `https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`;
                const res = await fetch(p1);
                const text = await res.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, "text/xml");
                const items = xml.querySelectorAll("item");
                if (items && items.length > 0) {
                    return Array.from(items).map(item => ({
                        title: item.querySelector("title")?.textContent || "Breaking Story",
                        link: item.querySelector("link")?.textContent || "#",
                        pubDate: item.querySelector("pubDate")?.textContent || "Recent",
                        desc: item.querySelector("description")?.textContent || ""
                    }));
                }
            } catch(e) {}

            // Tier 2 Proxy Fallback
            try {
                const p2 = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
                const res = await fetch(p2);
                const data = await res.json();
                if (data.status === 'ok' && data.items) {
                    return data.items.map(item => ({
                        title: item.title,
                        link: item.link,
                        pubDate: item.pubDate,
                        desc: item.description
                    }));
                }
            } catch(e) {}

            return null;
        }

        async function loadNews(queryKeyword = "") {
            const feedContainer = document.getElementById('newsFeed');
            const statusBanner = document.getElementById('statusBanner');
            const selectedCategory = document.getElementById('categorySelect').value;

            feedContainer.innerHTML = '<div class="loader">📡 Intercepting live neural feeds...</div>';
            statusBanner.style.display = 'none';

            let finalQuery = queryKeyword.trim() || selectedCategory;
            let targetUrl = finalQuery
                ? `https://news.google.com/rss/search?q=${encodeURIComponent(finalQuery)}&hl=en-US&gl=US&ceid=US:en`
                : `https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en`;

            const stories = await fetchFeed(targetUrl);

            if (!stories || stories.length === 0) {
                feedContainer.innerHTML = '<div class="loader">❌ No live articles retrieved. Try another keyword or refresh.</div>';
                return;
            }

            feedContainer.innerHTML = '';
            let newArticlesCount = 0;

            stories.slice(0, 10).forEach(story => {
                if (!seenLinks.has(story.link)) {
                    newArticlesCount++;
                    seenLinks.add(story.link);
                }

                const crux = cleanCruxText(story.desc);
                const pubFormatted = new Date(story.pubDate).toLocaleString() !== "Invalid Date"
                    ? new Date(story.pubDate).toLocaleString()
                    : story.pubDate;

                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="source-badge">LIVE NEWS</span>
                        <span class="card-time">🕒 ${pubFormatted}</span>
                    </div>
                    <div class="card-title">${story.title}</div>
                    <div class="card-crux">💡 <b>Crux:</b> ${crux}</div>
                    <a href="${story.link}" target="_blank" class="card-link">
                        Read full story on original publisher &rarr;
                    </a>
                `;
                feedContainer.appendChild(card);
            });

            statusBanner.style.display = 'flex';
            statusBanner.innerHTML = `🟢 Live news feed synced for: <b>${finalQuery || "Top Breaking Stories"}</b>`;
        }

        function executeSearch() {
            const val = document.getElementById('searchInput').value;
            loadNews(val);
        }

        function quickTag(tag) {
            document.getElementById('searchInput').value = tag;
            loadNews(tag);
        }

        function resetAndFetch() {
            document.getElementById('searchInput').value = '';
            loadNews();
        }

        // Trigger search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                executeSearch();
            }
        });

        // Trigger load when category dropdown changes
        document.getElementById('categorySelect').addEventListener('change', function() {
            document.getElementById('searchInput').value = '';
            loadNews();
        });

        // Initial Load
        loadNews();
    </script>
</body>
</html>
