<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsPulse 3D | Live Crux</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #030305;
            color: #f1f5f9;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 3D Three.js Canvas Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container */
        .app-container {
            position: relative;
            z-index: 2;
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header Styling */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title-glow {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff4b4b 0%, #7928ca 50%, #00dfd8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            filter: drop-shadow(0 10px 20px rgba(121, 40, 202, 0.4));
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 75, 75, 0.1);
            color: #ff4b4b;
            border: 1px solid rgba(255, 75, 75, 0.3);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }

        .pulse-dot {
            height: 8px;
            width: 8px;
            background-color: #ff4b4b;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 10px #ff4b4b;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            70% { transform: scale(1.6); opacity: 0; }
            100% { transform: scale(0.95); opacity: 0; }
        }

        /* Controls Panel */
        .controls {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 200px;
        }

        label {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 600;
        }

        select, input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: #00dfd8;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #7928ca, #00dfd8);
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 18px;
        }

        .refresh-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Status Banner */
        .status-banner {
            background: rgba(0, 223, 216, 0.08);
            border: 1px solid rgba(0, 223, 216, 0.2);
            color: #00dfd8;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            display: none;
        }

        /* 3D Glassmorphism News Cards */
        .news-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            transform-style: preserve-3d;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .news-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 223, 216, 0.4);
            box-shadow: 0 20px 40px rgba(0, 223, 216, 0.15);
        }

        .card-title {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .card-time {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 12px;
        }

        .card-crux {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            color: #00dfd8;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .card-link:hover {
            color: #ff4b4b;
        }

        .loader {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- 3D Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
        <div class="header">
            <h1 class="title-glow">⚡ NewsPulse 3D</h1>
            <div class="live-badge"><span class="pulse-dot"></span>LIVE CYBER FEED</div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Select Category</label>
                <select id="categorySelect" onchange="fetchNews()">
                    <option value="">🔥 Top Stories</option>
                    <option value="world news">🌍 World News</option>
                    <option value="business technology news">💼 Business & Tech</option>
                    <option value="artificial intelligence tech">🤖 AI & Technology</option>
                    <option value="sports news">⚽ Sports</option>
                    <option value="entertainment movie news">🎬 Entertainment</option>
                    <option value="health science news">🧬 Health & Science</option>
                </select>
            </div>
            <div class="control-group">
                <label>Custom Keyword</label>
                <input type="text" id="searchInput" placeholder="e.g. NVIDIA, Tesla" onkeypress="if(event.key === 'Enter') fetchNews()">
            </div>
            <button class="refresh-btn" onclick="fetchNews(true)">🔄 Refresh</button>
        </div>

        <div id="statusBanner" class="status-banner">🟢 Showing latest news updates...</div>
        <div id="newsFeed"></div>
    </div>

    <!-- Three.js for 3D Cyber Globe Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 3D Background Setup ---
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Create Particle Sphere (Cyber Globe Effect)
        const geometry = new THREE.BufferGeometry();
        const count = 1500;
        const positions = new Float32Array(count * 3);

        for(let i = 0; i < count * 3; i += 3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 45 + Math.random() * 5;
            
            positions[i] = r * Math.sin(phi) * Math.cos(theta);
            positions[i+1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i+2] = r * Math.cos(phi);
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ size: 0.8, color: 0x00dfd8, transparent: true, opacity: 0.7 });
        const sphere = new THREE.Points(geometry, material);
        scene.add(sphere);

        camera.position.z = 100;

        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.0005;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.0005;
        });

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.y += 0.002 + mouseX;
            sphere.rotation.x += 0.001 + mouseY;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- News Aggregator Script ---
        let seenArticles = new Set();

        async function fetchNews(isRefresh = false) {
            const feedContainer = document.getElementById('newsFeed');
            const statusBanner = document.getElementById('statusBanner');
            const category = document.getElementById('categorySelect').value;
            const customSearch = document.getElementById('searchInput').value.trim();

            feedContainer.innerHTML = '<div class="loader">📡 Connecting to live internet feed...</div>';
            statusBanner.style.display = 'none';

            let query = customSearch || category;
            let rssUrl = query 
                ? `https://news.google.com/rss/search?q=${encodeURIComponent(query)}&hl=en-US&gl=US&ceid=US:en`
                : `https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en`;

            // Using rss2json free API proxy to prevent CORS issues in browser
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
